<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Your Shop</title>
<style>
  body{font-family:Arial;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
  .box{background:white;padding:30px;border-radius:12px;width:90%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
  h2{text-align:center;margin:0 0 20px}
  input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
  button{width:100%;padding:12px;background:#000;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
  .link{text-align:center;margin-top:15px;font-size:14px;cursor:pointer;color:blue}
  #msg{text-align:center;color:red;font-size:14px;margin-top:10px}
  .hidden{display:none}
</style>
<style>
  /* --- ONLY LOOKS --- */
  body {
    margin: 0;
    background-image: url('https://images.unsplash.com/photo-1450778869180-41d0601e046e?w=1200') !important;
    background-size: cover !important;
    background-position: center !important;
    min-height: 100vh;
    overflow: hidden;
  }
  #landing {
    position: fixed; inset: 0; z-index: 20;
    background-image: url('https://images.unsplash.com/photo-1450778869180-41d0601e046e?w=1200');
    background-size: cover; background-position: center;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 40px; transition: transform 0.9s ease-in;
  }
  #landing.fall { transform: translateY(100%); }
  #landing{ overflow:hidden; }
.fall-text{
  padding:28px 42px; margin:20px;
  font-size:54px; font-weight:900; color:#fff; text-align:center;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:30px;
  box-shadow:0 25px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.8);
  text-shadow:0 0 25px #fff, 0 0 45px #00e5ff;
}
.bubble{
  position:absolute; bottom:-50px; border-radius:50%;
  background:rgba(255,255,255,0.25);
  border:1px solid rgba(255,255,255,0.6);
  animation:rise 3s linear infinite;
  pointer-events:none;
}
.bubble:nth-child(1){left:10%; width:60px; height:60px;}
.bubble:nth-child(2){left:25%; width:35px; height:35px;}
.bubble:nth-child(3){left:50%; width:80px; height:80px;}
.bubble:nth-child(4){left:70%; width:45px; height:45px;}
.bubble:nth-child(5){left:85%; width:65px; height:65px;}
@keyframes rise{to{transform:translateY(-110vh); opacity:0;}}
.landing-footer{
  position:absolute; bottom:15px; left:50%; transform:translateX(-50%);
  width:max-content; max-width:92%;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center;
  padding:10px 22px;
  font-size:14px; font-weight:600; color:#fff; text-align:center;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.5);
  border-radius:50px;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
  z-index:5;
}
.email-3d{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 12px;
  background:linear-gradient(135deg,#ff6ec4,#7873f5,#00e5ff);
  border-radius:50px;
  color:#fff; text-decoration:none; font-weight:800;
  box-shadow:0 4px 0 #ff6ec4, 0 8px 0 #7873f5, 0 10px 15px rgba(0,0,0,0.4);
  transform:perspective(400px) rotateX(10deg);
}
.email-3d:active{ transform:translateY(3px); box-shadow:0 1px 0 #ff6ec4, 0 3px 0 #7873f5; }
.landing-footer{
  position:absolute; bottom:15px; left:50%; transform:translateX(-50%);
  width:max-content; max-width:92%;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center;
  padding:10px 22px;
  font-size:14px; font-weight:600; color:#fff; text-align:center;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.5);
  border-radius:50px;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
  z-index:5;
}
.email-3d{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 12px;
  background:linear-gradient(135deg,#ff6ec4,#7873f5,#00e5ff);
  border-radius:50px;
  color:#fff; text-decoration:none; font-weight:800;
  box-shadow:0 4px 0 #ff6ec4, 0 8px 0 #7873f5, 0 10px 15px rgba(0,0,0,0.4);
  transform:perspective(400px) rotateX(10deg);
}
.email-3d:active{ transform:translateY(3px); box-shadow:0 1px 0 #ff6ec4, 0 3px 0 #7873f5; }
  #letsGoBtn {
    padding: 16px 50px; font-size: 26px; font-weight: 900; color: white;
    background: linear-gradient(#ff7eb6, #ff2e7e); border: none; border-radius: 50px;
    cursor: pointer; box-shadow: 0 8px 0 #a8004a, 0 15px 25px rgba(0,0,0,0.4);
  }
  /* Make YOUR existing .box look fancy - we don't replace it */
  .box {
    background: rgba(255,255,255,0.85) !important;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,46,126,0.35) !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25) !important;
    border-radius: 22px !important;
  }
  .box button {
    background: linear-gradient(#ff7eb6, #ff2e7e) !important;
    border-radius: 50px !important;
    box-shadow: 0 6px 0 #a8004a !important;
  }
  .ribbon-footer {
    position: fixed; bottom: 0; left: 0; width: 100%; z-index: 5;
    text-align: center; padding: 14px;
    background: linear-gradient(#e84393, #c2185b);
    color: white; font-weight: bold; font-size: 18px;
  }
</style>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
  input, button, img { max-width: 100%; }
  @media (max-width: 768px) {
    body { display: block; padding: 12px; }
    .box { width: 100%; max-width: 380px; margin: 12px auto; }
    #landing { max-width: 100%; }
    .fall-text { max-width: 100%; font-size: clamp(30px, 9vw, 54px); padding: 20px; }
    .landing-footer { width: max-content; max-width: 100%; }
    .ribbon-footer { box-sizing: border-box; }
  }
</style>
</head>
<body><!-- LANDING - ONLY VISUAL -->
<div id="landing">
  <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
  <h1 class="fall-text">Welcome to pets world 🪩🐶🦜</h1>
  <button id="letsGoBtn" type="button">LET'S GO 🐾</button>
  <div class="landing-footer">
    <a class="email-3d" href="mailto:pets457@gmail.com">✉️ pets457@gmail.com</a>
    <span>• Terms & conditions apply</span>
    <span>• © 2026 petsshopworld. All rights reserved.</span>
  </div>
</div>
<div class="box">
  <!-- LOGIN -->
    <form id="loginBox">
    <h2>Welcome Back</h2>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
      <button type="submit">Login</button>
    <div class="link" onclick="showSignup()">No account? Create one</div>
    </form>

    <!-- SIGNUP -->
    <form id="signupBox" class="hidden">
      <h2>Create Account</h2>
      <input id="regName" type="text" placeholder="Full Name">
      <input id="regEmail" type="email" placeholder="Email" autocomplete="email">
      <input id="regPass" type="password" placeholder="Password (min 6)" autocomplete="current-password">
      <button type="submit">Sign Up</button>
      <div class="link" onclick="showLogin()">Already have account? Login</div>
    </form>
    <form id="verifyEmailBox" class="hidden">
      <h2>Verify Your Email</h2>
      <input id="verifyEmail" type="email" placeholder="Email" autocomplete="email" required>
      <input id="verifyCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required>
      <button type="submit">Verify Email</button>
      <div class="link" onclick="showLogin()">Back to Login</div>
    </form>
    <div id="msg"></div>
  </div>

  <script>
  function showSignup(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('verifyEmailBox').classList.add('hidden');document.getElementById('signupBox').classList.remove('hidden');}
  function showLogin(email){document.getElementById('signupBox').classList.add('hidden');document.getElementById('verifyEmailBox').classList.add('hidden');document.getElementById('loginBox').classList.remove('hidden');if(email)document.getElementById('loginEmail').value=email;}
  function showVerification(email){document.getElementById('loginBox').classList.add('hidden');document.getElementById('signupBox').classList.add('hidden');document.getElementById('verifyEmailBox').classList.remove('hidden');document.getElementById('verifyEmail').value=email;}

  localStorage.removeItem('petsAccount');
  document.getElementById('loginEmail').value = localStorage.getItem('userEmail') || '';

  async function signup(event){
    event.preventDefault();
    const account = {
      name: document.getElementById('regName').value.trim(),
      email: document.getElementById('regEmail').value.trim().toLowerCase(),
      password: document.getElementById('regPass').value
    };
    try {
      const response = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(account)
      });
      const data = await response.json();
      if (data.success) {
        document.getElementById('msg').innerText = 'Verification code sent. Enter the code emailed to you.';
        showVerification(account.email);
        return;
      }
      if (!data.fallback) {
        document.getElementById('msg').innerText = data.message || 'Account creation failed';
        alert(data.message || 'Account creation failed');
        return;
      }
      document.getElementById('msg').innerText = data.message || 'Account creation failed';
      alert(data.message || 'Account creation failed');
    } catch (error) {
      document.getElementById('msg').innerText = 'Error: ' + error.message;
      alert('Error: ' + error.message);
    }
  }
  async function verifyEmail(event){
    event.preventDefault();
    const email = document.getElementById('verifyEmail').value.trim().toLowerCase();
    const code = document.getElementById('verifyCode').value.trim();
    try {
      const response = await fetch('/api/verify-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code })
      });
      const data = await response.json();
      if (!data.success) {
        document.getElementById('msg').innerText = data.message || 'Email verification failed';
        alert(data.message || 'Email verification failed');
        return;
      }
      document.getElementById('msg').innerText = 'Email verified. You can now log in.';
      showLogin(email);
      alert('Email verified. Please log in.');
    } catch (error) {
      document.getElementById('msg').innerText = 'Error: ' + error.message;
      alert('Error: ' + error.message);
    }
  }
  async function login(event){
    event.preventDefault();
    const credentials = {
      email: document.getElementById('loginEmail').value.trim().toLowerCase(),
      password: document.getElementById('loginPass').value
    };
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(credentials)
      });
      const data = await response.json();
      if (data.success) {
        if (data.token) localStorage.setItem('token', data.token);
        localStorage.setItem('userEmail', credentials.email);
        localStorage.setItem('user', JSON.stringify(data.user));
        alert('Login success');
        window.location.href = 'index.html';
        return;
      }
      if (!data.fallback) {
        if (data.code === 'not_verified') {
          document.getElementById('msg').innerText = data.message;
          showVerification(credentials.email);
          alert(data.message);
          return;
        }
        const message = (data.message || '').toLowerCase();
        const errorMessage = data.code === 'email_not_found' || message.includes('no account') || message.includes('email not found') || message.includes('not registered')
          ? 'Email not found. Please create account first.'
          : data.code === 'wrong_password' || message.includes('wrong password') || message.includes('incorrect password') || message.includes('invalid password')
            ? 'Wrong password. Try again.'
            : 'Wrong email or password';
        document.getElementById('msg').innerText = errorMessage;
        alert(errorMessage);
        return;
      }
      document.getElementById('msg').innerText = data.message || 'Database unavailable';
      alert(data.message || 'Database unavailable');
      return;
    } catch (error) {
      document.getElementById('msg').innerText = 'Error: ' + error.message;
      alert('Error: ' + error.message);
    }
  }
  document.getElementById('loginBox').addEventListener('submit', login);
  document.getElementById('signupBox').addEventListener('submit', signup);
  document.getElementById('verifyEmailBox').addEventListener('submit', verifyEmail);

  document.getElementById('letsGoBtn').addEventListener('click', function() {
    document.getElementById('landing').classList.add('fall');
    setTimeout(() => {
      document.getElementById('landing').style.display = 'none';
      document.body.style.overflow = 'auto';
    }, 900);
  });
  </script>
  <div class="ribbon-footer">Welcome to Pets World ♥️😻</div>
  </body>
  </html>
