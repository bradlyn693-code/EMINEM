<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Pets</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
background:linear-gradient(rgba(15,23,42,.75),rgba(15,23,42,.85)),url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=1600&q=80') center/cover}
.bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:22px;animation:float 6s ease-in-out infinite;z-index:1}
.b1{width:70px;height:70px;left:8%;top:15%}.b2{width:50px;height:50px;left:85%;top:20%;animation-delay:1s}.b3{width:90px;height:90px;left:12%;bottom:12%;animation-delay:2s}.b4{width:45px;height:45px;left:78%;bottom:18%;animation-delay:.5s}.b5{width:60px;height:60px;left:45%;top:6%;animation-delay:1.5s}.b6{width:40px;height:40px;left:90%;bottom:35%;animation-delay:2.5s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.box{position:relative;z-index:2;width:100%;max-width:400px;padding:28px 26px;border-radius:24px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5);backdrop-filter:blur(16px);color:#fff}
.logo{font-size:42px;text-align:center}h2{text-align:center;font-size:26px;margin:6px 0 4px}.sub{text-align:center;font-size:13px;opacity:.9;margin-bottom:16px}
input{width:100%;padding:13px 14px;margin:7px 0;border-radius:14px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);color:#fff;outline:none;font-size:15px}
input::placeholder{color:rgba(255,255,255,.85)}
button{width:100%;padding:13px;border:0;border-radius:14px;margin-top:12px;cursor:pointer;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(34,197,94,.45)}
button.link{background:none;box-shadow:none;color:#a7f3d0;padding:6px;font-size:13px}
#msg{margin-top:12px;min-height:20px;font-size:14px;text-align:center;border-radius:10px;padding:8px}
#msg.ok{background:rgba(34,197,94,.35)}#msg.err{background:rgba(239,68,68,.4)}
.hidden{display:none}.foot{text-align:center;font-size:13px;margin-top:14px}a{color:#a7f3d0;font-weight:700}
</style>
</head>
<body>
<div class="bubble b1">🐾</div><div class="bubble b2">🐶</div><div class="bubble b3">🐱</div><div class="bubble b4">🐾</div><div class="bubble b5">🦴</div><div class="bubble b6">🐾</div>
<div class="box">
<div class="logo">🐶🐱</div>

<!-- LOGIN -->
<div id="step-login">
<h2>Welcome back</h2><p class="sub">Login to your Pets account</p>
<input id="email" type="email" placeholder="✉️ Email">
<input id="password" type="password" placeholder="🔒 Password">
<button onclick="doLogin()">Continue ➜</button>
<button class="link" onclick="showStep('step-forgot')">Forgot password?</button>
</div>

<!-- RESET PASSWORD - EMAIL -->
<div id="step-forgot" class="hidden">
<h2>Reset password</h2><p class="sub">Enter your email to receive a code</p>
<input id="forgotEmail" type="email" placeholder="✉️ Email">
<button onclick="sendResetCode()">Send code 📩</button>
<button class="link" onclick="showStep('step-login')">← Back to login</button>
</div>

<!-- ENTER CODE - AUTO VERIFY -->
<div id="step-code" class="hidden">
<h2>Enter code</h2><p class="sub">We sent a code to <b id="showEmail"></b></p>
<input id="resetCode" inputmode="numeric" maxlength="6" placeholder="🔑 6-digit code" style="text-align:center;font-size:20px;letter-spacing:6px">
<p class="sub">Type the 6 digits — it will verify automatically</p>
<button class="link" onclick="showStep('step-forgot')">← Wrong email?</button>
</div>

<!-- NEW PASSWORD -->
<div id="step-newpass" class="hidden">
<h2>New password</h2><p class="sub">Create a new 6+ character password</p>
<input id="newPass" type="password" placeholder="🔒 New password">
<input id="confirmNewPass" type="password" placeholder="🔒 Confirm new password">
<button onclick="doResetPassword()">Change password</button>
<button class="link" onclick="showStep('step-login')">Back to login</button>
</div>

<div id="msg"></div>
<p class="foot">No account? <a href="signup.html">Create account</a></p>
</div>

<script>
let forgotEmail="";
function showStep(id){['step-login','step-forgot','step-code','step-newpass'].forEach(s=>document.getElementById(s).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function setMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className=ok?'ok':(t?'err':'');}

async function doLogin(){
  const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
  if(!email||!password){setMsg('Fill email and password');return;}
  setMsg('Checking...');
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){setMsg(d.error||'Account doesn\'t exist');return;}
    if(d.token) localStorage.setItem('token',d.token);
    setMsg('Welcome back ✅',true);
    setTimeout(()=>location.href='index.html',900);
  }catch(e){setMsg('Cannot reach server');}
}

async function sendResetCode(){
  forgotEmail=document.getElementById('forgotEmail').value.trim();
  if(!forgotEmail){setMsg('Enter email');return;}
  setMsg('Sending code...');
  try{
    const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotEmail})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){setMsg(d.error||'Account doesn\'t exist');return;}
    document.getElementById('showEmail').textContent=forgotEmail;
    document.getElementById('resetCode').value="";
    showStep('step-code');setMsg('Check your email for the verification code',true);
  }catch(e){setMsg('Cannot reach server');}
}

// AUTO VERIFY - as soon as 6 digits typed
document.getElementById('resetCode').addEventListener('input', async (e)=>{
  e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);
  if(e.target.value.length===6){
    setMsg('Verifying... ⏳');
    try{
      const r=await fetch('/api/auth/verify-reset-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotEmail,code:e.target.value})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){setMsg(d.error||'Wrong / expired code');e.target.value="";return;}
      setMsg('Code verified ✅',true);
      setTimeout(()=>{showStep('step-newpass');setMsg('');},600);
    }catch(err){setMsg('Cannot reach server');}
  }
});

async function doResetPassword(){
  const np=document.getElementById('newPass').value,cp=document.getElementById('confirmNewPass').value,code=document.getElementById('resetCode').value.trim();
  if(np.length<6){setMsg('Password must be 6+ characters');return;}
  if(np!==cp){setMsg('Passwords do not match');return;}
  setMsg('Saving...');
  try{
    const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotEmail,code,newPassword:np})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){setMsg(d.error||'Wrong / expired code');return;}
    setMsg('password changed successfully ✍️',true);
    setTimeout(()=>{showStep('step-login');setMsg('');},1200);
  }catch(e){setMsg('Cannot reach server');}
}
</script>
</body>
</html>
