<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7f0">
  <title>Find Your New Best Friend</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff7f0;
      color: #222;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 560px);
      padding: 42px 28px;
      border: 1px solid #ffe3c9;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 12px 36px rgba(90, 54, 25, .12);
    }
    .pets { margin-bottom: 12px; font-size: 48px; }
    h1 { margin: 0 0 12px; color: #c94f08; font-size: clamp(30px, 8vw, 44px); }
    p { margin: 0 0 26px; color: #555; font-size: 18px; }
    .actions { display: grid; gap: 12px; }
    a {
      display: block;
      padding: 15px 20px;
      border: 1px solid #ff6b00;
      border-radius: 999px;
      background: #fff;
      color: #c94f08;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }
    a.primary { background: #ff6b00; color: #fff; }
    a[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="pets" aria-hidden="true">🐶 🐱 🐾</div>
    <h1>Find Your New Best Friend</h1>
    <p>Adopt your best friend today</p>
    <nav class="actions" aria-label="Get started">
      <a class="primary" href="signup.html">Get Started / Sign Up</a>
      <a href="login.html">Login</a>
      <a id="browsePets" href="login.html">Browse Pets</a>
      <a id="continueHome" href="home.html" hidden>Continue to Home</a>
    </nav>
  </main>
  <script>
    const isLoggedIn = localStorage.getItem("loggedIn") === "true";
    document.getElementById("browsePets").href = isLoggedIn ? "home.html" : "login.html";
    document.getElementById("continueHome").hidden = !isLoggedIn;
  </script>
</body>
</html>
