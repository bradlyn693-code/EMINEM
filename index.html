<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pets Shop 🐶</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pets World">
<link rel="apple-touch-icon" href="icon.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
body {
  height:100vh; overflow:hidden;
  background: linear-gradient(135deg, #ffd6e8, #ffe8c9, #c9f0ff);
  display:flex; align-items:center; justify-content:center;
}
#page { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; transition: transform 0.7s ease, opacity 0.7s ease; }
#page.collapse { transform: translateY(100%) scale(0.9); opacity:0; }

/* Bubbles */
#bubbles { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
.bubble {
  position:absolute; bottom:-80px; border-radius:50%;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(4px);
  border:1px solid rgba(255,255,255,0.7);
  box-shadow: inset -8px -8px 15px rgba(255,255,255,0.8), inset 5px 5px 10px rgba(255,255,255,0.4), 0 10px 20px rgba(0,0,0,0.1);
  display:flex; align-items:center; justify-content:center;
  animation: rise linear infinite, wobble 2s ease-in-out infinite alternate;
}
@keyframes rise { to { transform: translateY(-110vh); } }
@keyframes wobble { from { margin-left:-15px; } to { margin-left:15px; } }

/* Card */
.card {
  position:relative; z-index:10; text-align:center;
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(15px);
  border:1px solid rgba(255,255,255,0.8);
  border-radius:30px; padding:40px 30px; width:90%; max-width:420px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 1px 0 white;
  animation: floaty 3s ease-in-out infinite;
}
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-12px) rotate(1deg); } }
.card h1 { font-size:32px; line-height:1.2; margin-bottom:12px; }
.card p { color:#444; font-size:16px; margin-bottom:25px; }
.btn {
  background: linear-gradient(135deg, #ff6b9d, #ff9a3d);
  color:white; border:none; padding:16px 35px; font-size:20px; font-weight:bold;
  border-radius:50px; cursor:pointer;
  box-shadow: 0 10px 0 #d14a7a, 0 15px 25px rgba(0,0,0,0.2);
  transition: transform 0.15s;
}
.btn:hover { transform: scale(1.05); }
.btn:active { transform: translateY(6px) scale(0.98); box-shadow: 0 4px 0 #d14a7a; }

/* Footer */
footer {
  position:fixed; bottom:0; left:0; width:100%; z-index:20; text-align:center;
  padding:12px 10px; font-size:14px; line-height:1.5; font-weight:bold;
  background: rgba(255,255,255,0.45); backdrop-filter: blur(12px);
  border-top:1px solid rgba(255,255,255,0.8);
}
</style>
</head>
<body>

<div id="bubbles"></div>

<div id="page">
  <div class="card">
    <h1>Welcome to Pets Shop 🛒🛍️🐶</h1>
    <p>Find your new best friend - toys, food, love & care for your pets</p>
    <button class="btn" onclick="goSignup()">Let's go 🛒</button>
  </div>
</div>

<footer>
  📨 pets457@gmail.com<br>
  ©️ 2025 petsshopworld<br>
  Shop with us 🛒🛍️
</footer>

<script>
// Create bubbles
const emojis = ['🦴','🐾','🐶','🦴','🐾','🐶'];
const container = document.getElementById('bubbles');
for(let i=0;i<22;i++){
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 35 + Math.random()*55;
  b.style.width = size+'px';
  b.style.height = size+'px';
  b.style.left = Math.random()*100+'%';
  b.style.fontSize = (size*0.45)+'px';
  b.style.animationDuration = (6 + Math.random()*7)+'s';
  b.style.animationDelay = (Math.random()*6)+'s';
  b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  container.appendChild(b);
}

function goSignup(){
  document.getElementById('page').classList.add('collapse');
  setTimeout(()=>{ window.location.href = 'signup.html'; }, 700);
}
</script>
<!-- INSTALL APP POPUP -->
<div id="installPopup" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:white;border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);align-items:center;gap:12px;">
  <img src="icon.png" style="width:56px;height:56px;border-radius:14px;object-fit:cover;">
  <div style="flex:1;text-align:left;">
    <b style="font-size:16px;color:#222;">Install Pets World App 🐾</b>
    <div style="font-size:13px;color:#666;">Install for faster access, works like a real app!</div>
  </div>
  <button id="installBtn" style="background:#ff6b00;color:white;border:none;padding:10px 16px;border-radius:25px;font-weight:bold;cursor:pointer;white-space:nowrap;">Install</button>
  <button onclick="document.getElementById('installPopup').style.display='none';localStorage.setItem('installDismissed','1')" style="background:none;border:none;font-size:20px;cursor:pointer;">✕</button>
</div>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  if (!window.matchMedia('(display-mode: standalone)').matches && localStorage.getItem('installDismissed') !== '1') {
    setTimeout(() => { document.getElementById('installPopup').style.display = 'flex'; }, 3000);
  }
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return; deferredPrompt.prompt();
  const choice = await deferredPrompt.userChoice;
  if (choice.outcome === 'accepted') { document.getElementById('installPopup').style.display = 'none'; }
  deferredPrompt = null;
});
window.addEventListener('appinstalled', () => { document.getElementById('installPopup').style.display = 'none'; });
</script>
</body>
</html>
