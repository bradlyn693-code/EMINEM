<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Pets Shop 🛍️</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{
    min-height:100vh;overflow:hidden;
    background:
      linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.15)),
      url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=1800&q=80') center/cover no-repeat;
  }
  #landing{
    min-height:100vh;display:flex;flex-direction:column;
    transition: transform 0.9s cubic-bezier(.7,0,.3,1), opacity 0.9s ease;
    transform-origin:top center;position:relative;z-index:2;
  }
  #landing.collapse{
    transform: translateY(110%) scaleY(0.2) rotateX(25deg);
    opacity:0;pointer-events:none;
  }
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  .glass-box{
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.55);
    border-radius: 32px;padding: 36px 32px 30px;
    max-width: 680px;width:100%;
    box-shadow: 0 25px 50px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.8);
    transform: perspective(1000px) rotateX(4deg);
  }
  .welcome{
    font-size: clamp(32px, 6vw, 56px);font-weight: 900;line-height:1.1;
    background: linear-gradient(180deg,#ffffff 0%, #ffe3ec 40%, #ff9ec2 70%, #ff4d7d 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,0.15)) drop-shadow(0 12px 18px rgba(255,77,125,0.35));
  }
  .subtitle{margin-top:14px;color:#fff;font-size:16px;font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,0.6)}
  .pets-row{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .pets-row span{background:rgba(255,255,255,0.9);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;color:#333;box-shadow:0 6px 15px rgba(0,0,0,0.2)}
  .go-btn{
    margin-top:26px;border:none;cursor:pointer;padding:16px 42px;
    font-size:20px;font-weight:900;color:#fff;border-radius:999px;
    background: linear-gradient(135deg,#ff4d7d,#ff7a3d);
    box-shadow: 0 10px 0 #c2184a, 0 18px 30px rgba(255,77,125,0.5);
    transition: all .15s ease;transform: perspective(800px) translateZ(20px);
  }
  .go-btn:hover{transform: perspective(800px) translateZ(30px) scale(1.03)}
  .go-btn:active{transform: translateY(8px);box-shadow: 0 2px 0 #c2184a, 0 8px 15px rgba(255,77,125,0.4)}
  footer{background: rgba(0,0,0,0.55);backdrop-filter: blur(12px);color:#fff;text-align:center;padding:14px 12px;font-size:13px;line-height:1.7}
  footer a{color:#ffd1e0;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div id="landing">
  <div class="center">
    <div class="glass-box">
      <div class="welcome">Welcome to Pets<br>Shop 🛍️ 🛒🐶🦜</div>
      <div class="subtitle">Dogs • Puppies • Cats • Kittens • Parrots — All at Home, All Loved ❤️</div>
      <div class="pets-row">
        <span>🐶 Dogs</span><span>🐾 Puppies</span><span>🐱 Cats</span><span>😺 Kittens</span><span>🦜 Parrots</span>
      </div>
      <button class="go-btn" onclick="goShop()">Let's go 🐶</button>
    </div>
  </div>
  <footer>
    📨 <a href="mailto:pets457@gmail.com">pets457@gmail.com</a> &nbsp; | &nbsp; ©️ petsshopworld &nbsp; | &nbsp; Terms and conditions apply ✅
  </footer>
</div>
<script>
function goShop(){
  document.getElementById('landing').classList.add('collapse');
  setTimeout(()=>{ window.location.href = 'login.html'; }, 900);
}
</script>
</body>
</html>
