<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pets - Search</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0f172a;color:#fff;padding:16px}header{display:flex;gap:8px;max-width:900px;margin:auto}input{flex:1;padding:14px;border-radius:14px;border:0}button{padding:14px 20px;border:0;border-radius:14px;background:#22c55e;color:#fff;font-weight:800;cursor:pointer}
.grid{max-width:900px;margin:16px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:rgba(255,255,255,.12);border-radius:18px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover}.pad{padding:12px}.price{color:#4ade80;font-weight:800;font-size:18px}.desc{font-size:13px;opacity:.9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{background:#1e293b;border-radius:18px;max-width:520px;width:100%;padding:16px;max-height:90vh;overflow:auto}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gal img{width:100%;height:130px;object-fit:cover;border-radius:12px;cursor:pointer}.main{width:100%;height:260px;object-fit:cover;border-radius:14px}
</style></head><body>
<header>
<select id="type" style="padding:14px;border-radius:14px;border:0;font-weight:800">
  <option value="dog">🐶 Dog</option>
  <option value="cat">🐱 Cat</option>
</select>
<input id="q" placeholder="Breed: Labrador, Poodle, Persian..." value="labrador">
<button onclick="search()">Search 🔍</button>
</header>
<div id="grid" class="grid"></div>
<div id="modal" class="modal" onclick="if(event.target==this)closeModal()"><div class="box"><img id="mMain" class="main"><h2 id="mName"></h2><div id="mPrice" class="price"></div><p id="mDesc"></p><p id="mMeta" style="font-size:13px;opacity:.8"></p><div id="mGal" class="gal"></div><button onclick="closeModal()" style="width:100%;margin-top:12px">Close</button></div></div>
<script>
let pets=[];
async function search(){
  const q=document.getElementById('q').value||'dog';
  document.getElementById('grid').innerHTML='<p>Loading pets...</p>';
 const r=await fetch('/api/search?q='+encodeURIComponent(q)+'&type='+type);
  document.getElementById('grid').innerHTML=pets.map((p,i)=>`
    <div class="card"><img src="${p.mainPhoto}"><div class="pad">
    <b>${p.name}</b><div class="price">$${p.price}</div>
    <div class="desc">${p.description.slice(0,90)}...</div>
    <button style="width:100%" onclick="viewPet(${i})">View Pet - 4 Photos</button>
    </div></div>`).join('') || '<p>No pets found</p>';
}
function viewPet(i){const p=pets[i];
  document.getElementById('mMain').src=p.mainPhoto;
  document.getElementById('mName').textContent=p.name+' - '+p.breed;
  document.getElementById('mPrice').textContent='$'+p.price;
  document.getElementById('mDesc').textContent=p.description;
  document.getElementById('mMeta').textContent=`Temperament: ${p.temperament} | Origin: ${p.origin} | Life: ${p.life}`;
  document.getElementById('mGal').innerHTML=p.photos.map(u=>`<img src="${u}" onclick="document.getElementById('mMain').src='${u}'">`).join('');
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
search();
</script></body></html>
