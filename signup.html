<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Sign Up - Pets</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background:
        linear-gradient(rgba(10, 10, 10, .62), rgba(10, 10, 10, .78)),
        url("https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=1600&q=80") center / cover no-repeat,
        #111;
    }
    .card {
      width: min(92vw, 400px);
      max-height: 92dvh;
      overflow-y: auto;
      padding: 28px 20px 22px;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 24px;
      background: rgba(255, 255, 255, .18);
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    h1 { margin: 8px 0 4px; font-size: 28px; }
    p { margin: 0 0 18px; font-size: 14px; opacity: .9; }
    input {
      width: 100%;
      margin: 0 0 12px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, .4);
      border-radius: 999px;
      outline: none;
      background: rgba(255, 255, 255, .2);
      color: white;
      font-size: 16px;
    }
    input::placeholder { color: rgba(255, 255, 255, .85); }
    button {
      width: 100%;
      margin-top: 4px;
      padding: 15px;
      border: 0;
      border-radius: 999px;
      background: #00c853;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    a { color: #b9f6ca; font-weight: bold; }
    .message { min-height: 20px; margin: 12px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <div aria-hidden="true" style="font-size:38px">🐶🐱</div>
    <h1>Create account</h1>
    <p>Join Pets in seconds</p>
    <form id="signupForm">
      <input id="name" type="text" placeholder="Full name" autocomplete="name" required>
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="new-password" minlength="6" required>
      <input id="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" required>
      <button type="submit">Sign Up</button>
    </form>
    <p id="message" class="message" role="status"></p>
    <p>Already have account? <a href="login.html">Login</a></p>
  </main>
  <script>
    document.getElementById("signupForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
      }
      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }
      if (localStorage.getItem("user_" + email)) {
        message.textContent = "An account with this email already exists.";
        return;
      }

      localStorage.setItem("user_" + email, JSON.stringify({ name, email, password }));
      localStorage.setItem("loggedIn", "false");
      sessionStorage.setItem("signupMessage", "Account created! Please login.");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
