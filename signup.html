<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up - Pets</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
  background:
    linear-gradient(rgba(15,23,42,.75), rgba(15,23,42,.85)),
    url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=1600&q=80') center/cover,
    url('https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=1600&q=80') center/cover;
}
body::before{
  content:"";position:absolute;inset:0;
  background:url('https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=1200&q=80') left bottom/320px no-repeat,
             url('https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=1200&q=80') right top/300px no-repeat;
  opacity:.35;pointer-events:none;
}
/* BUBBLES */
.bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;font-size:22px;animation:float 6s ease-in-out infinite;z-index:1}
.b1{width:70px;height:70px;left:8%;top:15%;animation-delay:0s}
.b2{width:50px;height:50px;left:85%;top:20%;animation-delay:1s}
.b3{width:90px;height:90px;left:12%;bottom:12%;animation-delay:2s}
.b4{width:45px;height:45px;left:78%;bottom:18%;animation-delay:.5s}
.b5{width:60px;height:60px;left:45%;top:6%;animation-delay:1.5s}
.b6{width:40px;height:40px;left:90%;bottom:35%;animation-delay:2.5s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}

/* GLASS BOX */
.box{
  position:relative;z-index:2;width:100%;max-width:400px;padding:28px 26px;border-radius:24px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:#fff;transform:perspective(900px) rotateX(2deg);
}
.logo{font-size:42px;text-align:center}
h2{text-align:center;font-size:26px;margin:6px 0 4px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.sub{text-align:center;font-size:13px;opacity:.9;margin-bottom:16px}
input{
  width:100%;padding:13px 14px;margin:7px 0;border-radius:14px;border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.18);color:#fff;outline:none;font-size:15px;
}
input::placeholder{color:rgba(255,255,255,.85)}
input:focus{background:rgba(255,255,255,.28);border-color:#fff}
button{
  width:100%;padding:13px;border:0;border-radius:14px;margin-top:12px;cursor:pointer;
  background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:800;font-size:16px;
  box-shadow:0 8px 20px rgba(34,197,94,.45);
}
button:active{transform:scale(.98)}
#msg{margin-top:12px;min-height:20px;font-size:14px;text-align:center;background:rgba(0,0,0,.25);border-radius:10px;padding:6px}
.hidden{display:none}
a{color:#a7f3d0;font-weight:700}
.foot{text-align:center;font-size:13px;margin-top:14px}
.code-box p{font-size:14px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="bubble b1">🐾</div><div class="bubble b2">🐶</div><div class="bubble b3">🐱</div>
<div class="bubble b4">🐾</div><div class="bubble b5">🦴</div><div class="bubble b6">🐾</div>

<div class="box">
  <div class="logo">🐶🐱</div>
  <h2>Create account</h2>
  <p class="sub">Join the Pets family — find your best friend</p>

  <div id="step1">
    <input id="name" placeholder="🐾 Full name">
    <input id="email" type="email" placeholder="✉️ Email">
    <input id="password" type="password" placeholder="🔒 Password">
    <input id="confirmPassword" type="password" placeholder="🔒 Confirm password">
    <button onclick="doSignup()">Create account ✨</button>
  </div>

  <div id="step2" class="hidden code-box">
    <p>We sent a 6-digit code to<br><b id="showEmail"></b><br>Valid for 10 minutes. Check spam too.</p>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="🔑 Enter 6-digit code" style="text-align:center;font-size:20px;letter-spacing:6px">
    <button onclick="doVerify()">Verify code ✅</button>
    <p style="font-size:13px;margin-top:10px">Wrong email? <a href="#" onclick="back()">Go back</a></p>
  </div>

  <div id="msg"></div>
  <p class="foot">Already have account? <a href="login.html">Login</a></p>
</div>

<script>
let savedEmail = "";
function show(t){ document.getElementById("msg").textContent = t; }
async function doSignup(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  if(!name || !email || !password){ show("Fill all fields"); return; }
  if(password !== confirmPassword){ show("Passwords do not match"); return; }
  show("Creating account...");
  try{
    const r = await fetch("/api/signup", {method:"POST",headers:{"Content-Type":"application/json"},body: JSON.stringify({name, email, password, confirmPassword})});
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ show(d.error || "Signup failed"); return; }
    savedEmail = email;
    document.getElementById("showEmail").textContent = email;
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
    show("Code sent to your email");
  }catch(e){ show("Cannot reach server. Is server.js running?"); }
}
async function doVerify(){
  const code = document.getElementById("code").value.trim();
  if(!/^\d{6}$/.test(code)){ show("Enter 6-digit code"); return; }
  show("Verifying...");
  try{
    const r = await fetch("/api/auth/verify", {method:"POST",headers:{"Content-Type":"application/json"},body: JSON.stringify({email: savedEmail, code})});
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ show(d.error || "Wrong / expired code"); return; }
    if(d.token) localStorage.setItem("token", d.token);
    show("Verified! Redirecting...");
    setTimeout(()=> location.href = "login.html", 800);
  }catch(e){ show("Cannot reach server"); }
}
function back(){
  document.getElementById("step2").classList.add("hidden");
  document.getElementById("step1").classList.remove("hidden");
}
</script>
</body>
</html>
