<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.box{background:#1e1e1e;padding:25px;border-radius:12px;width:100%;max-width:380px}
h2{text-align:center}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;box-sizing:border-box}
button{width:100%;padding:12px;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-size:16px}
#msg{text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="box">
<h2>Reset Password</h2>
<input id="pass" type="password" placeholder="New password">
<input id="pass2" type="password" placeholder="Confirm new password">
<button onclick="resetPass()">Reset Password</button>
<p id="msg"></p>
</div>
<script>
async function resetPass(){
  const token = new URLSearchParams(location.search).get('token');
  const p1 = document.getElementById('pass').value;
  const p2 = document.getElementById('pass2').value;
  const msg = document.getElementById('msg');
  if(!token){ msg.textContent='Invalid or missing link.'; return; }
  if(p1.length < 6){ msg.textContent='Password must be at least 6 characters.'; return; }
  if(p1 !== p2){ msg.textContent='Passwords do not match.'; return; }
  msg.textContent='Resetting...';
  try{
    const res = await fetch('/api/reset-password', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token, password:p1})
    });
    const data = await res.json();
    if(res.ok){ msg.textContent='Password reset! Go to login.'; setTimeout(()=> location.href='login.html',1500); }
    else msg.textContent = data.message || 'Failed. Link may have expired.';
  }catch(e){ msg.textContent='Network error. Try again.'; }
}
</script>
</body>
</html>
